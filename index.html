<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orthogonal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts are a progressive enhancement: the game falls back to
     system mono/sans if they fail to load (offline, or a strict WebView). -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<!-- The stylesheet is split by screen and loaded in this order; the cascade
     depends on it. docs/UI.md maps each screen to its file. -->
<link rel="stylesheet" href="css/00-base.css">
<link rel="stylesheet" href="css/10-buttons.css">
<link rel="stylesheet" href="css/20-hud.css">
<link rel="stylesheet" href="css/30-editor.css">
<link rel="stylesheet" href="css/40-panels.css">
<link rel="stylesheet" href="css/50-layout-cues.css">
<link rel="stylesheet" href="css/60-splash.css">
<link rel="stylesheet" href="css/65-replay.css">
<link rel="stylesheet" href="css/70-cards.css">
<link rel="stylesheet" href="css/75-bossbar.css">
<link rel="stylesheet" href="css/80-panel-tall.css">
<link rel="stylesheet" href="css/85-map.css">
<link rel="stylesheet" href="css/90-tutorial.css">
<link rel="stylesheet" href="css/95-home.css">
</head>
<body>

<!-- THE ICONS ARE DRAWN, NOT OUTLINED. Every one of these used to be a
     1.7px hairline path, which at 19px on a dark ground is a diagram of the
     thing rather than the thing - reported as not feeling alive. They are
     solid shapes now with a second tone in them: a body in the button's own
     hue, a lighter accent where the object would catch light, and a hole
     where it would be dark. `.ln` is the stroked half, `.lite` the
     highlight, `.dim` the receding half. -->
<div class="corner tl">
  <!-- The same cog the home screen's SETTINGS wears (#hMenu below), so the
       one door into settings has one picture wherever you meet it. It used
       to be three bars, which read as a menu of places rather than a panel
       of switches. -->
  <button class="rnd" id="bMenu" aria-label="Settings"><svg viewBox="0 0 24 24"
    fill-rule="evenodd"><path d="M13.75 1.8h-3.5l-.42 2.5a8.2 8.2 0 0 0-1.83
    1.06L5.72 4.3 3.97 7.33l1.94 1.6a8.2 8.2 0 0 0 0 2.14l-1.94 1.6 1.75
    3.03 2.28-1.06a8.2 8.2 0 0 0 1.83 1.06l.42 2.5h3.5l.42-2.5a8.2 8.2 0 0 0
    1.83-1.06l2.28 1.06 1.75-3.03-1.94-1.6a8.2 8.2 0 0 0 0-2.14l1.94-1.6
    -1.75-3.03-2.28 1.06a8.2 8.2 0 0 0-1.83-1.06ZM12 12.9a2.9 2.9 0 1 1 0-5.8
    2.9 2.9 0 0 1 0 5.8Z"/></svg></button>
  <button class="rnd" id="bWard" aria-label="Wardrobe"><svg viewBox="0 0 24 24">
    <path class="ln" d="M12 10.2V9c0-1 .7-1.6 1.5-2a1.9 1.9 0 1 0-2.7-1.7"
      stroke-width="2.1"/>
    <path d="M12.7 10.1h-1.4l-7.6 5.3c-1.6 1.1-.8 3.6 1.1 3.6h14.4c1.9 0 2.7-2.5
      1.1-3.6l-7.6-5.3Z"/>
    <path class="lite" d="M12 12.1 6.2 16.2c-.5.4-.3 1 .3 1h11c.6 0 .8-.6.3-1L12
      12.1Z"/></svg></button>
  <!-- The count rides the bulb, because a pool nobody can see is a pool
       nobody will spend. Written by syncHud(). -->
  <button class="rnd" id="bHint" aria-label="Hint"><svg viewBox="0 0 24 24">
    <path d="M12 2.4a6.6 6.6 0 0 0-4 11.8c.5.4.9 1 1 1.7h6c.1-.7.5-1.3
      1-1.7A6.6 6.6 0 0 0 12 2.4Z"/>
    <rect x="8.9" y="17.1" width="6.2" height="2.2" rx="1.1"/>
    <rect class="dim" x="10.1" y="20.2" width="3.8" height="2" rx="1"/>
    <path class="ln lite" d="M9.6 7.9a3.6 3.6 0 0 1 2.6-1.7" stroke-width="1.7"/>
    </svg><b class="hn" id="hintN"></b></button>
</div>
<div class="corner tr">
  <button class="rnd" id="bRestart" aria-label="Restart level"><svg viewBox="0 0 24 24">
    <path class="ln" d="M19.6 12a7.6 7.6 0 1 1-2.3-5.4" stroke-width="2.8"/>
    <path d="M20.6 3.5v6.1a.6.6 0 0 1-.7.6l-5.7-.6c-.6-.1-.8-.8-.3-1.2l5.7-5.4
      c.4-.4 1-.1 1 .5Z"/></svg></button>
  <button class="rnd" id="bLook" aria-label="Look around"><svg viewBox="0 0 24 24">
    <path fill-rule="evenodd" d="M12 5.1C5.9 5.1 2.1 10.5 2.1 12s3.8 6.9 9.9
      6.9 9.9-5.4 9.9-6.9-3.8-6.9-9.9-6.9Zm0 3.3a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0
      0 0 0-7.2Z"/>
    <circle class="lite" cx="13.6" cy="10.5" r="1.15"/></svg></button>
  <!-- THERE IS NO SAVE BUTTON. It was a green pill in this corner - the one
       the five round buttons leave empty while the editor is open - carrying
       an amber dot whenever the library was behind the board. It was moved
       here from the editor bar because it was being forgotten there, which
       was the right diagnosis of the wrong problem: the fix for a control
       nobody remembers to press, when the machine knows perfectly well when
       to press it, is not to make it louder. The editor writes every edit
       into MY LEVELS as you make it (autosave(), js/14-editor.js). -->
</div>
<!-- Deliberately outside .corner: stars land here from the win screen, which
     is a full-bleed overlay above it, so this needs its own stacking context
     over that overlay. Putting it in .corner would drag the buttons up too. -->
<div class="startotal" id="starTotal" aria-label="Stars earned">
  <b id="starTotalN">0</b><i>&#9733;</i>
</div>

<div class="boss" id="bossBar">
  <!-- Two sides, not one stack. The row used to be a single centred column in
       the gap between the corner clusters, which put your lives and the thing
       hunting you in the same place and made you read a legend to tell them
       apart. Now the sides say it: yours on the left, under the level text and
       over your own piece; the opposition's on the right. syncBossBar() drops
       the whole row below .hud, whose height moves with the hint. -->
  <div class="bside"><div class="blives" id="bossLives"></div></div>
  <div class="bside bthem"><div class="bcores" id="bossCores"></div></div>
</div>

<div class="hud">
  <div>
    <div class="title" id="lvName">—</div>
    <div class="hint" id="lvHint"></div>
    <!-- THE PRIMER: a level's rules, said in a list rather than in a hint.
         One level uses it (SPARRING), and it is at the top of the screen
         because it is what the player is meant to read before they touch
         anything. Filled by syncHud() from L.primer; see css/00-base.css.
         NOT the retired "brief", which was a full-bleed card - that word is
         still taken, in cardOwner; see js/15-tutorial.js. -->
    <div class="primer" id="lvPrimer" hidden></div>
  </div>
  <!-- The stars are their own element and NOT part of moveLabel: syncHud
       rewrites the count on every redraw, and a row rebuilt under a running
       animation restarts it. See syncStars() in js/18-ui.js. -->
  <div class="axis"><div class="moves" id="moveLabel"></div>
    <div class="stars" id="starRow" hidden></div></div>
</div>

<div class="coach" id="coach"></div>
<!-- THE HAND ITSELF, defined once and used twice per drawing.

     It was a glowing dot per finger and nothing else, and it was reported
     exactly as people not understanding that the double tap was a *finger*.
     A dot is a contact point, which is the abstraction you can read once you
     already know what the picture is of; a hand is the thing being drawn.

     Each hand is stamped twice from the same symbol - once as a fat round
     stroke in near-black, once filled in bone on top of it - which is how a
     silhouette assembled from four overlapping rectangles gets an outline
     with no seams showing where they meet. Bone with a dark rim reads on the
     void and on the plane's paper alike, which nothing single-coloured does.
     The green stays on the contact dot and the track, so the hand is the
     drawing and the green is still the instruction. -->
<svg class="ghdefs" width="0" height="0" aria-hidden="true">
  <!-- One finger, pointing up, tip at (40,14): the index out of a closed
       fist. Rectangles rather than a single traced path, because the shapes
       are what the parts are and a fist is easier to nudge as four boxes
       than as one forty-point outline. -->
  <symbol id="ghOne" viewBox="0 0 120 160">
    <rect x="27" y="14" width="26" height="78" rx="13"/>
    <rect x="52" y="64" width="25" height="40" rx="12.5"/>
    <rect x="74" y="72" width="23" height="36" rx="11.5"/>
    <rect x="24" y="86" width="76" height="64" rx="26"/>
    <path d="M30 100 C14 106 8 120 15 132 C20 140 30 140 35 132 L46 114 Z"/>
  </symbol>
  <!-- Two fingers, tips at (38,14) and (82,14): index and middle out of the
       same fist, tips 64 units apart - which at the half scale this is drawn
       at is the 32px between the two contacts. Drawn pointing up and TURNED
       A QUARTER TURN BY THE CSS, so the two tips end up stacked one above
       the other with the fist trailing behind them, pointing the way the
       hand is about to travel.

       The two fingers are held well apart on purpose: at 22px the contacts
       overlapped and the pair read as one thick finger. Four numbers move
       together if this changes - the two tips here, the two `.gfinger`
       margins, the pair's rendered width, and the translate on the
       left-hand version.

       Both arrangements have now been played. Side by side with the hand
       upright is how a hand really sits on glass, and it reads as one wide
       shape sliding sideways - the two contacts move along their own line of
       travel, which is the same picture a single-finger swipe already draws.
       Stacked, the pair crosses its own direction of movement, so the
       two-ness survives the motion. That was the original call, made back
       when each contact was a bare dot; it survives the hand being drawn,
       and the hand simply turns to match. -->
  <symbol id="ghTwo" viewBox="0 0 170 160">
    <rect x="25" y="14" width="26" height="80" rx="13"/>
    <rect x="89" y="14" width="26" height="80" rx="13"/>
    <rect x="115" y="64" width="24" height="40" rx="12"/>
    <rect x="136" y="72" width="22" height="36" rx="11"/>
    <rect x="22" y="84" width="130" height="64" rx="26"/>
    <path d="M28 98 C13 105 8 120 15 132 C20 140 30 140 35 132 L46 114 Z"/>
  </symbol>
</svg>
<!-- The gesture tutorial's ghost hand. A hand and a contact dot per finger,
     a track showing where it travels and two rings for the double tap; which
     of those is visible is a class on the wrapper, and how far it travels is
     a pair of custom properties. See tutGhost() in js/15-tutorial.js. -->
<div class="ghost" id="ghost" aria-hidden="true">
  <div class="gtrack"></div>
  <div class="gfinger a">
    <svg class="ghand single" viewBox="0 0 120 160">
      <use href="#ghOne" class="ghrim"/><use href="#ghOne" class="ghbody"/>
    </svg>
    <svg class="ghand pair" viewBox="0 0 150 160">
      <use href="#ghTwo" class="ghrim"/><use href="#ghTwo" class="ghbody"/>
    </svg>
    <i class="gdot"></i><i class="gtap"></i><i class="gtap two"></i>
  </div>
  <div class="gfinger b"><i class="gdot"></i></div>
  <!-- TWO WORDS, BESIDE THE HAND. A drawing of a gesture can be read wrong -
       the double tap was reported as looking like a swipe up - and the one
       place a name cannot be missed is next to the thing it names. Written
       by tutGhost()/cueGhost() from GEST_SAY in js/15-tutorial.js. -->
  <div class="glabel" id="ghostSay"></div>
</div>
<div class="phasenote" id="phaseNote"></div>
<!-- WHAT KILLED YOU, said where you are already looking. One short line over
     the kill cam; see deathSayShow() in js/12-play.js and .deathsay in
     css/90-tutorial.css, which is where its sibling the phase note lives. -->
<div class="deathsay" id="deathSay"></div>

<!-- THE STRIKE STING. The one beat in the game that is allowed to be loud:
     a core going down, or one of your own lives going. It is DOM rather than
     anything in the scene because it has to cover the whole screen and it has
     to be free on a phone in the most expensive moment the game has - see
     .bsting in css/65-replay.css, and bossSting() in js/12-play.js, which is
     the only thing that writes it. -->
<div class="bsting" id="bossSting" aria-hidden="true">
  <i class="bsflash"></i>
  <i class="bsray"></i>
  <i class="bsring one"></i>
  <i class="bsring two"></i>
  <div class="bsword"><b id="bossStingWord"></b><i id="bossStingSub"></i></div>
</div>

<!-- THE REPLAY'S OWN CHROME. A replay that looks exactly like play is just
     the game behaving oddly, so it gets the two things film has used for the
     same job forever: bars top and bottom, and a label saying what it is.
     Everything here is inert - the fight is frozen underneath. -->
<!-- THE KILL CAM'S WIND-UP. Between the hit and the film: the signal drops
     (white noise, the old no-connection screen), a camcorder is walked up to
     the screen and pushed through it, and what is on the other side of its
     lens is the replay, with the record light on. Driven entirely by
     killCamStart() in js/12-play.js, which sets one class per beat; see
     .killcam in css/65-replay.css. The static is painted into #kcNoise -
     random pixels in a 96x160 buffer, blown up - because a CSS approximation
     of television snow is a texture and this has to be noise. -->
<div class="killcam" id="killCam" aria-hidden="true">
  <div class="kcsnow"><canvas id="kcNoise" width="96" height="160"></canvas>
    <i class="kcroll"></i><i class="kcvhs"></i></div>
  <!-- The camcorder. Everything but the lens glass is opaque, so when it is
       pushed into the screen the glass is the last thing left and the film is
       what is behind it. -->
  <div class="kcrig"><div class="kccam">
    <i class="kcbody"></i><i class="kchandle"></i><i class="kcmic"></i>
    <i class="kcvf"></i><i class="kcbarrel"></i><i class="kclens"></i>
    <i class="kcglass"></i><i class="kctally"></i>
  </div></div>
  <!-- The viewfinder, which is what is left once the camera is through: the
       bracket, the record light in the top right, and a running timecode. -->
  <div class="kcframe">
    <i class="kcb tl"></i><i class="kcb tr"></i><i class="kcb bl"></i><i class="kcb br"></i>
    <div class="kcrec"><b>REC</b><s></s></div>
    <div class="kctc" id="kcTime">00:00:00</div>
  </div>
</div>

<div class="replayui" id="replayUI" aria-hidden="true">
  <div class="rdim"></div>
  <div class="rbar top"></div>
  <div class="rbar bot"></div>
  <div class="rlabel"><s></s><b>REPLAY</b><i id="replayNote"></i></div>
</div>

<!-- THE WAY OUT. The whole sequence is the better part of seven seconds and
     a player who has seen it does not want it again; this is a full-bleed
     catcher that only accepts a press while the film is up, so the tap that
     skips can never also reach the board underneath. It lives outside
     #replayUI because that layer is pointer-events:none by design and the
     skip is the one thing here that must be pressable. See replaySkip() in
     js/12-play.js. -->
<div class="rskip" id="repSkip"><i>TAP TO SKIP</i></div>

<div class="bar on" id="playBarWrap">
  <div id="playBar" class="on">
    <div class="dpad">
      <span></span><button id="bUp"><svg class="ar" viewBox="0 0 24 24">
        <path d="M12 6.4 19.2 17H4.8Z"/></svg></button><span></span>
      <button id="bLeft"><svg class="ar" viewBox="0 0 24 24">
        <path d="M6.4 12 17 4.8v14.4Z"/></svg></button><span></span>
      <button id="bRight"><svg class="ar" viewBox="0 0 24 24">
        <path d="M17.6 12 7 19.2V4.8Z"/></svg></button>
      <span></span><button id="bDown"><svg class="ar" viewBox="0 0 24 24">
        <path d="M12 17.6 4.8 7h14.4Z"/></svg></button><span></span>
    </div>
    <div class="rcol">
      <div class="rot">
        <!-- A TURN IS DRAWN AS A TURN. These were &#8630; and &#8631; - two
             text glyphs a font renders as hairlines about eight pixels
             across, sitting in the middle of a 58px cap, which is why they
             read as empty boxes and got reported as missing buttons. -->
        <button id="bRotL"><svg class="ar tn" viewBox="0 0 24 24">
          <path class="ln" d="M4.6 12.6a7.6 7.6 0 1 1 2.7 5.5" stroke-width="2.9"/>
          <path d="M3.4 4.4v6.1c0 .4.3.7.7.6l5.8-.6c.6-.1.8-.8.3-1.2L4.5 3.9
            c-.5-.4-1.1-.1-1.1.5Z"/></svg></button>
        <button id="bRotR"><svg class="ar tn" viewBox="0 0 24 24">
          <path class="ln" d="M19.4 12.6a7.6 7.6 0 1 0-2.7 5.5" stroke-width="2.9"/>
          <path d="M20.6 4.4v6.1c0 .4-.3.7-.7.6l-5.8-.6c-.6-.1-.8-.8-.3-1.2l5.7-5.4
            c.5-.4 1.1-.1 1.1.5Z"/></svg></button>
      </div>
      <button class="flatbtn" id="bFlat">FLATTEN</button>
    </div>
  </div>
</div>

<div class="bar" id="editBarWrap">
  <div id="editBar">
    <!-- The level's own row: out to the list of your levels. Nothing here
         keeps the level, because nothing has to - every edit writes it; see
         autosave() and saveCurrent() in js/14-editor.js. -->
    <div class="row rowTop">
      <button class="tiny" id="eLevels">&#8592; MY LEVELS</button>
      <span class="spacer"></span>
    </div>
    <div class="row">
      <button class="chip sel" id="tAdd">SOLID</button>
      <!-- WATER and FIRE, which is what the player reads everywhere else in
           the game; the ids keep the code's own older names. -->
      <button class="chip" id="tGlass">WATER</button>
      <button class="chip" id="tAnchor">AMBER</button>
      <button class="chip" id="tCrate">CRATE</button>
      <button class="chip" id="tKey">KEY</button>
      <button class="chip" id="tSpike">FIRE</button>
      <button class="chip" id="tErase">ERASE</button>
      <button class="chip" id="tStart">START</button>
      <button class="chip" id="tGoal">GOAL</button>
    </div>
    <div class="row row2">
      <button class="ico" id="eRotL">&#8630;</button>
      <button class="ico" id="eRotR">&#8631;</button>
      <button class="ico" id="eUndo">&#8634;</button>
      <button class="verify" id="eVerify">VERIFY</button>
      <button style="width:52px" id="eTest">TEST</button>
      <button class="ico" id="eFile">&#8943;</button>
    </div>
  </div>
</div>

<div class="bar" id="composeBarWrap">
  <div id="composeBar">
    <div class="row">
      <button class="chip" id="cU">&#9650;</button>
      <button class="chip" id="cL">&#9664;</button>
      <button class="chip" id="cR">&#9654;</button>
      <button class="chip" id="cD">&#9660;</button>
    </div>
    <div class="row row2">
      <button class="ico" id="cRotL">&#8630;</button>
      <button class="ico" id="cRotR">&#8631;</button>
      <button style="flex:1" id="cFlat">FLATTEN</button>
      <button style="flex:1" id="cPop">POP</button>
    </div>
    <div class="row row2">
      <button class="ico" id="cDel">&#9003;</button>
      <button class="verify" id="cBuild">BUILD LEVEL</button>
      <button style="width:52px" id="cExit">EXIT</button>
    </div>
  </div>
</div>

<!-- The sting. Empty here on purpose: 20-splash.js builds the wordmark out
     of one div per voxel, and a hand-written grid of 69 of them in the markup
     would be a bitmap nobody could edit. -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="sstage" id="splashStage"></div>
  <div class="srule"></div>
  <div class="sprompt" id="splashPrompt">tap to fold</div>
  <div class="sbloom"></div>
</div>

<!-- The home screen. Everything inside .hwrap is written by homeSync() in
     js/16-panels.js, except the stand: that canvas is handed to the wardrobe's
     previewStart(), so the character you are looking at is built by the same
     code that builds the display case. -->
<div class="home" id="home">
  <div class="hwrap">
    <div class="htitle">Orthogonal</div>
    <div class="hsub">a cube, a world, one verb</div>
    <!-- The plinth wears the same frame the wardrobe's case does (.wglass in
         css/40-panels.css); the floor strip is the light spilling out of the
         render onto the page. -->
    <div class="hstand wglass"><canvas id="homeCase"></canvas><i class="wfloor"></i></div>
    <div class="hstars"><b id="homeStars">0</b><i>&#9733;</i> earned</div>
    <div class="hbtns">
      <!-- The emblem is written by homeSync(): it is the section you are
           being sent into, drawn exactly as its tile is drawn on the
           chooser, so the button and the place it leads carry one picture as
           well as one colour. -->
      <button class="hcont" id="hContinue"><span class="hci" id="hContIcon"></span>
        <span class="hct"><b>START</b><i></i></span></button>
      <!-- Four squares, which is literally what LEVELS opens. -->
      <button class="hward hlevels" id="hLevels"><svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.2" y="3.2" width="7.4" height="7.4" rx="1.7"/>
        <rect x="13.4" y="3.2" width="7.4" height="7.4" rx="1.7"/>
        <rect x="3.2" y="13.4" width="7.4" height="7.4" rx="1.7"/>
        <rect x="13.4" y="13.4" width="7.4" height="7.4" rx="1.7"/></svg><span>LEVELS</span></button>
    </div>
    <!-- The two browse rows that used to sit here are gone; the wardrobe is
         the one way in now. The icon is the same hanger the HUD's wardrobe
         button wears, so the two are recognisably the same door. -->
    <div class="hshop">
      <button class="hward" id="hWard"><svg viewBox="0 0 24 24">
        <path class="ln" d="M12 10.2V9c0-1 .7-1.6 1.5-2a1.9 1.9 0 1 0-2.7-1.7"
          stroke-width="2.1"/>
        <path d="M12.7 10.1h-1.4l-7.6 5.3c-1.6 1.1-.8 3.6 1.1 3.6h14.4c1.9 0 2.7-2.5
          1.1-3.6l-7.6-5.3Z"/>
        <path class="lite" d="M12 12.1 6.2 16.2c-.5.4-.3 1 .3 1h11c.6 0 .8-.6.3-1L12
          12.1Z"/></svg><span>WARDROBE</span></button>
      <!-- MY LEVELS: the level editor, under its own name and on the screen
           you choose a place to go from, rather than filed under More in the
           settings panel beside RESET SETTINGS. -->
      <button class="hward hmine" id="hMine"><svg viewBox="0 0 24 24">
        <path d="M3.4 5.6h6.2l1.9 2.3h9.1c.9 0 1.6.7 1.6 1.6v9c0 .9-.7 1.6-1.6
          1.6H3.4c-.9 0-1.6-.7-1.6-1.6V7.2c0-.9.7-1.6 1.6-1.6Z"/>
        <path class="lite" d="M11.1 11.2h1.8v2.4h2.4v1.8h-2.4v2.4h-1.8v-2.4H8.7v-1.8

<div class="won" id="intro">
  <h2 style="font-size:30px;letter-spacing:-.03em">Orthogonal</h2>
  <!-- THE PREMISE IS BOLTED ON, NOT WOVEN IN. The two lines above the rule
       are the only explanation of the verb a new player ever gets, so they
       are untouched; the Census is a third line under a divider, which is
       the arrangement that lets the story be cut without taking the lesson
       with it. One sentence, and the bosses say the rest. -->
  <p style="max-width:80vw;text-align:center;line-height:1.7">
    A cube, a world, and one verb.<br>
    Drop the world to 2D and things far apart in depth<br>land side by side.
  </p>
  <p class="introstory">Everything this world has ever flattened is still in there.</p>
  <button id="bBegin">BEGIN</button>
  <button class="tiny" id="bSkipTo" style="height:30px;padding:0 14px">PICK A LEVEL</button>
</div>

<!-- THE TUTORIAL'S EXPLANATION CARD. One rule in this game cannot be taught
     by cueing a button, because the two blocks it decides between are at the
     same screen position the moment you fold; see tutCardSync() in
     js/15-tutorial.js. It borrows .won's full-bleed dim so a card and a win
     card are plainly the same kind of object, and answers screenUp() so the
     keyboard and both clocks stop while it is being read. -->
<div class="won tutcard" id="tutcard">
  <h2 id="tutcardH"></h2>
  <p id="tutcardP"></p>
  <button id="bTutOk">OK</button>
</div>

<div class="won" id="won">
  <h2 id="wonTitle">Solved</h2>
  <p id="wonSub"></p>
  <div class="wonrow">
    <button id="bRetry"><svg viewBox="0 0 24 24">
      <path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>TRY AGAIN</button>
    <!-- The label is a span because win() rewrites it six ways (NEXT LEVEL,
         PLAY AGAIN, WHAT'S LEFT, DONE, BACK TO EDITOR); textContent on the
         button itself would take the arrow with it. -->
    <button id="bNext"><span id="bNextT">NEXT</span><svg viewBox="0 0 24 24"
      aria-hidden="true"><path d="M5 12h12"/><path d="M12.5 6.2 19 12l-6.5 5.8"/>
      </svg></button>
  </div>
  <!-- The same cap the home screen's LEVELS wears - cyan, four squares, a lip
       - because it opens the same chooser. Still the quiet third choice: it
       sits below the row and is a size down, so it does not rival NEXT. -->
  <button class="wonlv" id="bLevels"><svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="3.2" y="3.2" width="7.4" height="7.4" rx="1.7"/>
    <rect x="13.4" y="3.2" width="7.4" height="7.4" rx="1.7"/>
    <rect x="3.2" y="13.4" width="7.4" height="7.4" rx="1.7"/>
    <rect x="13.4" y="13.4" width="7.4" height="7.4" rx="1.7"/></svg><span>LEVELS</span></button>
</div>

<!-- THE STING PAINTS BEFORE THREE.JS PARSES, and that is what this block is.

     Everything below used to load first and 21-boot.js called splashShow()
     at the end of it, so the card - the thing whose whole job is to cover a
     cold start - only went up once the most expensive script in the page had
     been downloaded and evaluated. three.min.js is the bulk of that and the
     sting does not need a line of it: the wordmark is one div per voxel and
     some CSS. So it is built and armed here, and the rest of the game loads
     behind a card the player is already looking at.

     `$` is the one helper 20-splash.js reaches for. It is declared here so
     the load order below can stay exactly as documented; 18-ui.js declares it
     again later, identically, and a function declaration simply overwrites. -->
<script>function $(id){return document.getElementById(id);}</script>
<script src="js/20-splash.js"></script>
<script>splashShow();</script>

<script src="vendor/three.min.js"></script>
<!-- Load order matters: these are classic scripts sharing one global
     scope, and 21-boot.js is the only file that runs anything. Three.js has
     to come before 09 and 10, which build THREE.Color instances at top
     level - it is the one thing the "only declares" rule does not cover. -->
<script src="js/00-storage.js"></script>
