apply plugin: 'com.android.application'

android {
    // The namespace is the Java package MainActivity lives in; the
    // applicationId is the app's identity on the phone and in Play. They are
    // separate on purpose: Play Console registered the app as
    // com.nadazgames.ImJustACube, capitals and all, and an id is compared
    // case-sensitively, so only the applicationId had to change.
    namespace "com.nadazgames.imjustacube"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nadazgames.ImJustACube"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // THE VERSION CODE IS A COUNTER PLAY OWNS, AND IT ONLY EVER GOES UP.
        // Play refuses an upload whose versionCode it has already seen -
        // "Version code 1 has already been used" - and it refuses it even if
        // the build that used it was never released, was rolled back, or was
        // deleted from a track. A number, once uploaded, is spent forever.
        //
        // So BUMP THIS BEFORE EVERY UPLOAD, including a re-upload of a build
        // that was only meant to replace a draft. It is the one line that
        // cannot be recovered by rebuilding.
        //
        // versionName is the string a player sees and has no such rule; it
        // can repeat, and it is kept in step here only so a crash report can
        // be matched to a build.
        versionCode 5
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        // A DEV BUILD INSTALLS BESIDE THE PLAY ONE, NOT OVER IT.
        //
        // The app on a test phone comes from Play and is signed with the Play
        // key; a debug APK is signed with the debug key, and Android refuses
        // to swap one for the other (INSTALL_FAILED_UPDATE_INCOMPATIBLE). The
        // only way through is to uninstall first, and uninstalling takes the
        // app's data with it - which is the SAVE, since every orthogonal:*
        // key lives in the WebView's localStorage. It also takes the phone
        // out of whatever Play track put the app there.
        //
        // A suffixed applicationId makes the debug build a different app
        // entirely: its own icon, its own data, its own localStorage. It
        // installs and uninstalls freely while the Play build and its save
        // sit untouched beside it.
        //
        // What it can and cannot test. ADS: fully - AdMob's test units do not
        // care what the package is called. IAP: not at all - Play Billing
        // only sells to a build Play distributed under the id it knows, so
        // the BUY button will reach the store and be refused. That is the
        // right split, because ads are what needs a fast loop and a purchase
        // needs a track either way.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
